<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="燃費計算">
<link rel="manifest" href="manifest.json">
<title>⛽ 燃費計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.container{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:23px;margin:4px 0 16px}h2{font-size:19px;margin:2px 0 12px}
label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:17px;background:#fff}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.result div{background:#f1f4f8;border-radius:10px;padding:11px}.result span{display:block;color:#666;font-size:13px}.result strong{font-size:21px}
.add{width:100%;margin-top:15px;padding:13px;border:0;border-radius:9px;background:#1677ff;color:#fff;font-size:17px;font-weight:700}
.note{font-size:12px;color:#666;margin:9px 0 0}canvas{width:100%;height:260px}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.del{border:0;background:#eee;border-radius:7px;padding:6px 8px}.empty{text-align:center;color:#777;padding:20px}
.install{background:#eef5ff;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
@media(max-width:480px){.container{padding:10px}canvas{height:230px}th,td{font-size:12px}}
</style>
</head>
<body>
<div class="container">
<h1>⛽ ガソリン燃費計算</h1>
<div id="installHelp" class="install">このページをスマホのホーム画面に追加すると、アプリのように使えます。</div>

<div class="card">
<label>日付</label><input id="date" type="date">
<label>走行距離（km）</label><input id="distance" type="number" min="0" step="0.1" inputmode="decimal" placeholder="例：420">
<label>給油量（L）</label><input id="liters" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例：25.5">
<label>給油金額（円）</label><input id="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="例：4080">
<div class="result">
<div><span>単価</span><strong id="price">---</strong> 円/L</div>
<div><span>燃費</span><strong id="economy">---</strong> km/L</div>
</div>
<button class="add" id="add">＋ 給油記録を追加</button>
<p class="note">単価＝給油金額÷給油量　／　燃費＝走行距離÷給油量</p>
</div>

<div class="card"><h2>燃費の推移</h2><canvas id="chart" width="700" height="260"></canvas></div>
<div class="card"><h2>給油履歴</h2><div id="history"></div></div>
</div>

<script>
const KEY="fuelRecords";
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("date").value=today();

function calc(){
 let d=+$("distance").value,l=+$("liters").value,a=+$("amount").value;
 $("price").textContent=l>0&&a>0?(a/l).toFixed(1):"---";
 $("economy").textContent=l>0&&d>0?(d/l).toFixed(1):"---";
}
["distance","liters","amount"].forEach(x=>$(x).addEventListener("input",calc));

$("add").onclick=()=>{
 let date=$("date").value,d=+$("distance").value,l=+$("liters").value,a=+$("amount").value;
 if(!date||d<=0||l<=0||a<=0){alert("日付・走行距離・給油量・給油金額を入力してください。");return}
 records.push({date,distance:d,liters:l,amount:a});
 records.sort((a,b)=>a.date.localeCompare(b.date));
 save();render();
 $("distance").value=$("liters").value=$("amount").value="";calc();
};
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function remove(i){if(confirm("この記録を削除しますか？")){records.splice(i,1);save();render()}}
function render(){
 let h=$("history");
 if(!records.length){h.innerHTML='<div class="empty">まだ給油記録がありません。</div>';draw();return}
 let s='<div class="tablewrap"><table><thead><tr><th>日付</th><th>距離</th><th>給油</th><th>金額</th><th>単価</th><th>燃費</th><th></th></tr></thead><tbody>';
 records.forEach((r,i)=>{let p=r.amount/r.liters,e=r.distance/r.liters;s+=`<tr><td>${r.date}</td><td>${r.distance.toFixed(1)}</td><td>${r.liters.toFixed(2)}</td><td>${r.amount.toLocaleString()}</td><td>${p.toFixed(1)}</td><td><b>${e.toFixed(1)}</b></td><td><button class="del" onclick="remove(${i})">削除</button></td></tr>`});
 h.innerHTML=s+"</tbody></table></div>";draw();
}
function draw(){
 let c=$("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 if(!records.length){ctx.fillStyle="#777";ctx.textAlign="center";ctx.font="13px sans-serif";ctx.fillText("記録を追加すると燃費グラフが表示されます",w/2,h/2);return}
 let v=records.map(r=>r.distance/r.liters),min=Math.max(0,Math.floor(Math.min(...v)-1)),max=Math.ceil(Math.max(...v)+1);
 let L=48,R=18,T=20,B=38,pw=w-L-R,ph=h-T-B;
 ctx.font="13px sans-serif";ctx.strokeStyle="#ddd";
 for(let i=0;i<=4;i++){let y=T+ph*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillStyle="#666";ctx.textAlign="right";ctx.fillText((max-(max-min)*i/4).toFixed(0),L-7,y+4)}
 let step=records.length===1?0:pw/(records.length-1),pts=v.map((x,i)=>[L+(records.length===1?pw/2:i*step),T+(max-x)/(max-min)*ph]);
 ctx.strokeStyle="#1677ff";ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
 pts.forEach((p,i)=>{ctx.fillStyle="#1677ff";ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fill();ctx.fillStyle="#333";ctx.textAlign="center";ctx.fillText(v[i].toFixed(1),p[0],p[1]-10);ctx.fillStyle="#666";ctx.fillText(i+1,p[0],h-15)});
 ctx.textAlign="center";ctx.fillText("給油回数",w/2,h-2);ctx.save();ctx.translate(12,h/2);ctx.rotate(-Math.PI/2);ctx.fillText("燃費（km/L）",0,0);ctx.restore();
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}
render();
</script>
</body>
</html>
